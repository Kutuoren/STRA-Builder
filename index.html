const STOP=new Set("the and for with that this are from have has not any all our their into per via can may use used using such each both within without until when where which will your you was were been being than then also only more most other these those over under between during before after about against".split(" "));

 SEC.forEach((sc,si)=>sc.q.forEach((q,qi)=>{const qt=toks(q[0]);let b=null,bs=0;ss.forEach(z=>{let m=0;qt.forEach(w=>{if(z.t.has(w))m++});const r=m/Math.max(qt.length,1);if(m>=2&&r>bs){bs=r;b=z}});if(b&&bs>=.3)S.sug[si+"."+qi]={v:"Review",ev:b.x.slice(0,300),doc:b.d,ap:true,m:"local"}}))}

async function aiSec(si){const sc=SEC[si];let ctx="";DOCS.forEach(d=>{ctx+=`\n=== DOCUMENT: ${d.name} (type: ${d.cat}) ===\n${d.text}\n`});ctx=ctx.slice(0,S.llm.max||30000);
 const qs=sc.q.map((q,qi)=>`${si}.${qi} | ${q[0]} | allowed: ${qo(q).join(" / ")}`).join("\n");
 const sys="You are a careful security assessor. Answer ONLY from the documents provided. Answer Yes only if the documents explicitly state the control exists, Partial if it is partly stated, No if the documents state it is absent. If the documents do not mention it, answer Not answered. For questions asking whether a risky condition exists, Yes means the condition exists. Never guess. Return ONLY a JSON array of objects {id, answer, evidence, doc}. evidence is a short verbatim quote from the documents (max 25 words); doc is the document name.";
 const t=await ask([{role:"system",content:sys},{role:"user",content:`${ctx}\n\nQUESTIONS (id | question | allowed answers):\n${qs}`}]);
 const m=t.match(/\[[\s\S]*\]/);if(!m)return;let arr;try{arr=JSON.parse(m[0])}catch{return}
 const all=norm(DOCS.map(d=>d.text).join(" "));
 arr.forEach(r=>{const k=String(r.id),[a,b]=k.split(".");const q=a==String(si)?sc.q[+b]:null;if(!q||!r.evidence)return;const v=qo(q).find(x=>x.toLowerCase()==String(r.answer).toLowerCase());if(!v)return;const ok=all.includes(norm(r.evidence).replace(/[.\u2026]+$/,""));S.sug[k]={v,ev:String(r.evidence).slice(0,300),doc:String(r.doc||""),ap:ok,nf:!ok,m:"ai"}})}

function capcsv(){const k=["CID","ID","Sec","Gap","RC","MT","PA","Hz","Dt","Ow","Act","VE","Ev","Rt","RRt","N","O"],hd=["CAPA ID","Risk ID","Area","Finding","Root cause","Corrective action","Preventive action","Timeframe (days)","Target date","Owner","Status","Verification of effectiveness","Evidence of closure","Inherent","Residual","NIST 800-53","ISO 27001"];
 dl("stra_capa.csv",[hd.join(",")].concat(gen().filter(f=>f.Ac).sort((x,y)=>x.Hz-y.Hz||y.Rs-x.Rs).map(f=>({...f,CID:"CAPA-"+f.ID.slice(2)})).map(f=>k.map(c=>esc(f[c])).join(","))).join("\n"),"text/csv")}

const LV=["Critical","High","Medium","Low"],BC={Critical:"#d64545",High:"#f0883e",Medium:"#f5d04c",Low:"#8fd19e"};
const LL=["","Rare","Unlikely","Possible","Likely","Almost certain"],IL=["","Negligible","Minor","Moderate","Major","Severe"];
const SD={Spoofing:["Impersonating users or services","MFA, SSO, strong authentication, credential vaulting","Unauthorized access and account takeover"],Tampering:["Modifying data, code or configuration","Input validation, WAF, signed builds, integrity checks","Loss of integrity in code, data or configuration"],Repudiation:["Denying or hiding actions","Centralized immutable logging, audit trails, SIEM","Late detection and weak audit and forensic evidence"],"Information disclosure":["Leakage of sensitive data","Encryption in transit and at rest, classification, DLP, key management","Data exposure with regulatory, contractual and reputational consequences"],"Denial of service":["Outage or disruption of service","WAF and rate limiting, redundancy, tested BC/DR, capacity management","Downtime and prolonged recovery affecting operations"],"Elevation of privilege":["Gaining higher-level access","RBAC, least privilege, PAM, patching, access reviews","Privilege abuse and lateral movement"]};
const domRows=()=>SEC.map((sc,si)=>{let g=0,p=0,b=0,u=0;sc.q.forEach((q,qi)=>{const v=(S.a[si+"."+qi]||{}).v;if(!v||v=="Not answered"||v=="N/A")return;const L=lik(q,v);L==0?g++:L==2?p++:L==3?u++:b++});const n=g+p+b+u;return{si,t:sc.t,tot:sc.q.length,n,g,p,b,u,pct:n?Math.round(100*(g+p/2)/n):null}});
const inpl=si=>SEC[si].q.filter((q,qi)=>{const v=(S.a[si+"."+qi]||{}).v;return v&&v!="Not answered"&&v!="N/A"&&lik(q,v)==0}).map(q=>q[0]);
const mat=r=>r.pct==null?["Not assessed","#d9dde3"]:r.pct>=75?["Effective","#8fd19e"]:r.pct>=40?["Partial","#f5d04c"]:["Absent / weak","#f08a8a"];
function build(){const p=S.proj,a=acc(),R=domRows(),A=R.reduce((x,r)=>x+r.n,0),TQ=R.reduce((x,r)=>x+r.tot,0),cov=A?Math.round(100*R.reduce((x,r)=>x+r.g+r.p/2,0)/A):0;
 const cell=c=>typeof c=="object"?`<td bgcolor="${c.bg}" style="background:${c.bg}">${c.t}</td>`:`<td>${c}</td>`;
 const T=(hd,r)=>`<table><tr>${hd.map(x=>`<th>${x}</th>`).join("")}</tr>${r.length?r.map(x=>`<tr>${x.map(cell).join("")}</tr>`).join(""):`<tr><td colspan="${hd.length}">None</td></tr>`}</table>`;
 const rb=l=>({t:"<b>"+l+"</b>",bg:BC[l]});
 const stack=pt=>`<table style="width:100%;border-collapse:collapse"><tr>${pt.filter(x=>x[0]>0).map(([v,c])=>`<td width="${Math.max(1,Math.round(v))}%" bgcolor="${c}" style="background:${c};height:12px;padding:0">&nbsp;</td>`).join("")||`<td style="height:12px">&nbsp;</td>`}</tr></table>`;
 const by=k=>a.filter(f=>f.Rt==k).length,byR=k=>a.filter(f=>f.RRt==k).length,top=LV.find(by)||"Low",topR=LV.find(byR)||"Low",mx=Math.max(1,...LV.map(by),...LV.map(byR));
 const st=f=>f.Act=="None"?"Not started":f.Act,H=[];
 const heat=()=>{let t=`<table style="width:auto"><tr><th>Impact / Likelihood</th>${[1,2,3,4,5].map(l=>`<th>${l} ${LL[l]}</th>`).join("")}</tr>`;for(let i=5;i>0;i--)t+=`<tr><th>${i} ${IL[i]}</th>${[1,2,3,4,5].map(l=>{const n=a.filter(f=>f.L==l&&f.I==i).length,c=BC[band(l*i)];return`<td align="center" bgcolor="${c}" style="background:${c};text-align:center;min-width:70px"><b>${n||""}</b><br><small>${l*i}</small></td>`}).join("")}</tr>`;return t+"</table>"};
 const open=[];SEC.forEach((sc,i)=>sc.q.forEach((q,j)=>{const v=(S.a[i+"."+j]||{}).v;if(!v||v=="Not answered")open.push(`${sc.t}: ${q[0]}`)}));
 const hz=[[30,"0-30 days"],[90,"31-90 days"],[180,"91-180 days (6 months)"],[365,"181-365 days (1 year)"]];
 const srt=a.slice().sort((x,y)=>x.Hz-y.Hz||y.Rs-x.Rs);
 H.push(`<h1>Security Threat and Risk Assessment (STRA)</h1><p><b>Target system / platform:</b> ${h(p.name)}<br><b>Assessed organization:</b> ${h(p.org)}<br><b>Assessment type:</b> ${h(p.atype||"New solution")}<br><b>Assessment date:</b> ${h(p.date)}<br><b>Prepared by:</b> ${h(p.by)}<br><b>Classification:</b> Confidential | Version 1.0 (draft for review)</p>`);
 H.push(`<h2>1. Organizational overview</h2>`+T(["Item","Detail"],[["Company",h(p.org)],["Business function",h(p.bf)],["Location",h(p.loc)],["Environment / hosting",`${h(p.env)} / ${h(p.hosting)}`],["Highest data classification",h(p.cls)],["Executive sponsor",h(p.sp)],["IT / security contact",h(p.it)],["Compliance officer",h(p.co)]]));
 H.push(`<h3>1.1 Summary</h3><p>This report assesses the cybersecurity posture of ${h(p.name)} as of ${h(p.date)}. It covers ${SEC.length} control domains (${A} of ${TQ} questions answered) using the risk assessment approach of NIST SP 800-30 and ISO/IEC 27005, with controls mapped to NIST SP 800-53 Rev. 5 and ISO/IEC 27001:2022 Annex A. Observations are followed by a risk evaluation, a threat model, and a corrective and preventive action plan.</p>`);
 H.push(`<h3>1.2 System overview</h3><p><b>Purpose:</b> ${h(p.purpose)||"Not provided"}</p><p><b>Components and data flows:</b> ${h(S.arch.notes)||"Not provided"}</p>`+(S.ints.length?T(["System","Type","Direction","Protocol","Authentication","Data exchanged"],S.ints.map(r=>[h(r.Sys),r.Type,r.Dir,r.Proto,r.Auth,h(r.Data)])):""));
 H.push(`<h3>1.3 Executive summary</h3><p><b>Context and scope.</b> ${h(p.purpose)||"See system overview"}. Out of scope and limitations: ${h(p.limits)||"none recorded"}.</p><p><b>Current risk posture.</b> Overall inherent risk is <b>${top}</b>; residual risk after recorded actions is <b>${topR}</b>. Control coverage is <b>${cov}%</b>. Findings: ${LV.map(k=>by(k)+" "+k).join(", ")} (inherent); ${LV.map(k=>byR(k)+" "+k).join(", ")} (residual).</p>`+T(["Risk level","Inherent","","Residual",""],LV.map(k=>[rb(k),by(k),stack([[100*by(k)/mx,BC[k]]]),byR(k),stack([[100*byR(k)/mx,BC[k]]])])));
 H.push(`<p><b>Top risks.</b></p><ol>${a.slice(0,5).map(f=>`<li>${f.ID} [${f.Rt}] ${h(f.Gap)} (${f.Sec})</li>`).join("")||"<li>None</li>"}</ol><p><b>Business impact.</b></p><ul>${[...new Set(a.map(f=>f.STR))].map(k=>`<li>${SD[k][2]}</li>`).join("")||"<li>None identified</li>"}</ul><p><b>What we will do.</b> ${hz.map(([z,l])=>`${l}: ${a.filter(f=>f.Hz==z).length} actions`).join("; ")}. Details are in the action plan and CAPA register.</p><p><b>Metrics to track quarterly.</b> Control coverage (now ${cov}%), open Critical and High risks (now ${byR("Critical")+byR("High")}), CAPA items completed on time, and evidence of closure collected.</p><p><b>Dependencies and assumptions.</b> ${h(p.assume)||"None recorded"}</p><p><b>Approvals requested.</b> Approve the CAPA plan and timeframes, assign an owner to each action, fund the remediation work, and endorse a quarterly risk review.</p>`);
 H.push(`<h3>Controls in place versus gaps by domain</h3>`+T(["Domain","Distribution","In place","Partial","Gap","Unknown","Coverage"],R.map(r=>[r.t,r.n?stack([[100*r.g/r.n,"#2e9d5b"],[100*r.p/r.n,"#e0a800"],[100*r.b/r.n,"#d64545"],[100*r.u/r.n,"#9aa5b4"]]):"Not assessed",r.g,r.p,r.b,r.u,r.pct==null?"-":r.pct+"%"]))+`<p><small>Green in place, amber partial, red gap, grey unknown.</small></p><h3>Risk heat map (likelihood x impact, number of risks per cell)</h3>`+heat());
 H.push(`<h2>2. Introduction</h2><h3>2.1 Background</h3><p>${h(p.purpose)||"Not provided"}</p><h3>2.2 Objectives</h3><p>Evaluate threats to the system, its integrations and supporting services; identify control gaps against NIST SP 800-53 and ISO/IEC 27001; and provide prioritized, actionable corrective and preventive actions.</p><h3>2.3 Stakeholders</h3>`+T(["Role","Name"],[["Executive sponsor",h(p.sp)],["IT / security lead",h(p.it)],["Compliance officer",h(p.co)],["Assessor",h(p.by)]])+`<h3>2.4 Methodology</h3><p>Risk = Likelihood x Impact on a 5 x 5 scale (section 6). Controls were assessed through a structured questionnaire${(S.dn||[]).length?" and a review of vendor documents":""}, STRIDE threat modeling, and mapping to NIST SP 800-53 Rev. 5 and ISO/IEC 27001:2022. Answers marked as taken from documents were verified by the analyst.</p>`+((S.dn||[]).length?`<p><b>Documents reviewed:</b></p><ul>${S.dn.map(x=>`<li>${h(x)}</li>`).join("")}</ul>`:""));
 H.push(`<h2>3. System description</h2><h3>3.1 Platform</h3><p>${h(p.name)} (${h(p.atype||"New solution")}), ${h(p.env)}, ${h(p.hosting)}</p><h3>3.2 Architecture diagram</h3>${S.arch.img?`<p><img src="${S.arch.img}" style="max-width:100%"></p>`:"<p>No diagram provided.</p>"}<h3>3.3 Data flow</h3><p>${h(S.arch.notes)||"Not provided"}</p>`);
 H.push(`<h2>4. Scope of assessment</h2><h3>4.1 In scope</h3>`+T(["Domain","Questions answered"],R.map(r=>[r.t,r.n+" of "+r.tot]))+`<h3>4.2 Out of scope and limitations</h3><p>${h(p.limits)||"None recorded"}</p>`);
 H.push(`<h2>5. Threat environment</h2><p><b>Threat actors:</b> external attackers targeting the platform and its APIs; insiders and contractors with excessive access; third parties and supply-chain compromise; automated bots and opportunistic scanners.</p><p><b>Threat categories identified in this assessment:</b></p><ul>${Object.keys(SD).map(k=>`<li>${k}: ${a.filter(f=>f.STR==k).length} risks</li>`).join("")}</ul>`);
 H.push(`<h2>6. Risk assessment methodology</h2><p>Risk = Likelihood x Impact. Likelihood and impact are rated 1 to 5; the product (1 to 25) sets the risk level. Residual risk applies a reduction for actions recorded (none and planned 100%, in progress 60%, implemented 30%). NIST SP 800-30 leaves scales and thresholds to the organization, so the thresholds below are adjustable.</p><h3>6.1 Likelihood</h3>`+T(["Score","Level","Basis in this assessment"],[[1,"Rare","Control effective; exposure highly unlikely"],[2,"Unlikely","Control partially in place"],[3,"Possible","Control status unknown or not verified"],[4,"Likely","Control absent or risky condition present"],[5,"Almost certain","Reserved for confirmed active exposure"]])+`<h3>6.2 Impact</h3>`+T(["Score","Level","Description"],[[1,"Negligible","No meaningful effect on operations or data"],[2,"Minor","Limited effect, easily recovered"],[3,"Moderate","Noticeable data or service impact"],[4,"Major","Significant data loss, outage or regulatory exposure"],[5,"Severe","Critical systems or highly sensitive data; major regulatory or reputational harm"]])+`<p>Impact combines the severity of the control area with the highest data classification (${h(p.cls)}).</p><h3>6.3 Risk levels</h3>`+T(["Level","Score","Expected response"],[[rb("Critical"),"20-25","Act within 30 days; escalate to executive sponsor"],[rb("High"),"12-19","Act within 90 days"],[rb("Medium"),"6-11","Act within 180 days"],[rb("Low"),"1-5","Act within 365 days or accept and monitor"]])+`<h3>6.4 Control maturity</h3><p>Effective: 75% or more of answered controls in place. Partial: 40% to 74%. Absent or weak: below 40%. Partial answers count 50%.</p>`);
 H.push(`<h2>7. Threat modeling (STRIDE)</h2><h3>7.1 Threat categories</h3>`+T(["Category","Description","Example risks","Control measures","Linked risks"],Object.keys(SD).map(k=>{const l=a.filter(f=>f.STR==k);return[k,SD[k][0],l.slice(0,2).map(f=>h(f.Gap)).join("; ")||"None identified",SD[k][1],l.map(f=>f.ID).join(", ")||"-"]}))+`<h3>7.2 Integrations and trust boundaries</h3>`+T(["System","Type","Direction / protocol / auth","Data","Crosses trust boundary","Threats found","Linked risks"],S.ints.map((r,i)=>{const l=a.filter(f=>new RegExp("^i"+i+"[a-z]$").test(f.k));return[h(r.Sys),r.Type,`${r.Dir} / ${r.Proto} / ${r.Auth}`,h(r.Data),r.Type=="Internal"?"No":"Yes",[...new Set(l.map(f=>f.STR))].join(", ")||"None from rules",l.map(f=>f.ID).join(", ")||"-"]})));
 H.push(`<h2>8. Security controls analysis</h2>`+T(["Control area","Existing practice (controls in place)","Maturity"],R.map(r=>{const l=inpl(r.si),m=mat(r);return[r.t,(l.length?"<ul>"+l.slice(0,4).map(x=>`<li>${h(x)}</li>`).join("")+(l.length>4?`<li>+${l.length-4} more</li>`:"")+"</ul>":"None confirmed")+`<small>${r.g} in place, ${r.p} partial, ${r.b} gap, ${r.u} unknown</small>`,{t:"<b>"+m[0]+"</b>",bg:m[1]}]})));
 H.push(`<h2>9. Risk control matrix</h2>`+T(["Risk","Threat (STRIDE)","Control reference","Owner","Status"],a.filter(f=>f.RRt=="Critical"||f.RRt=="High").slice(0,20).map(f=>[`${f.ID} ${h(f.Gap)}`,f.STR,`NIST ${f.N}; ISO ${f.O}`,h(f.Ow),st(f)])));
 const doms=[...new Set(a.map(f=>f.Sec))];
 H.push(`<h2>10. Risk assessment summary (NIST SP 800-30)</h2>`+T(["Asset / domain","Threat","Vulnerability (highest risk)","Risk level","Control"],doms.map(d=>{const l=a.filter(f=>f.Sec==d),t=l[0];return[d,t.STR,h(t.Gap)+(l.length>1?` (+${l.length-1} more)`:""),rb(t.Rt),`NIST ${t.N}; ISO ${t.O}`]})));
 H.push(`<h2>11. Current observations and risks</h2>`+T(["#","Category","Observation","Risk statement","Impact","Likelihood","Risk level","Mitigation recommendation","Action taken","Residual risk","Treatment / owner","NIST / ISO"],a.map((f,i)=>[i+1,f.Sec,h(f.Gap)+(f.Ans=="-"?"":": "+f.Ans)+(f.Det?" ("+h(f.Det)+")":""),h(f.RS),`${IL[f.I]} (${f.I})`,`${LL[f.L]} (${f.L})`,rb(f.Rt),h(f.MT),f.Act+(f.AN?": "+h(f.AN):""),rb(f.RRt),f.Tr+(f.Ow?" / "+h(f.Ow):""),`${f.N}<br>${f.O}`])));
 H.push(`<h2>12. Recommendations and action plan</h2><p>Timeframes follow residual risk unless overridden. Target dates count from the assessment date.</p>`+hz.map(([z,l])=>{const r=a.filter(f=>f.Hz==z);return`<h3>${l} (${r.length})</h3>`+T(["ID","Remediation action","Residual","Owner","Target date","Status"],r.map(f=>[f.ID,`${f.Sec}: ${h(f.MT)}`,rb(f.RRt),h(f.Ow),f.Dt,st(f)]))}).join(""));
 H.push(`<h2>13. CAPA register (corrective and preventive actions)</h2>`+T(["CAPA ID","Risk ID","Finding","Root cause","Corrective action","Preventive action","Timeframe","Owner","Target date","Status","Verification of effectiveness","Evidence of closure"],srt.map(f=>["CAPA-"+f.ID.slice(2),f.ID,`${f.Sec}: ${h(f.Gap)}`,h(f.RC),h(f.MT),h(f.PA),f.Hz+" days",h(f.Ow),f.Dt,st(f),h(f.VE),h(f.Ev)])));
 const sens=["Confidential","Restricted"].includes(p.cls);
 H.push(`<h2>14. Compliance and regulatory considerations</h2><ul><li>Frameworks referenced: NIST SP 800-30 Rev. 1, NIST SP 800-53 Rev. 5, ISO/IEC 27001:2022, ISO/IEC 27005.</li>${sens?`<li>The system handles ${h(p.cls)} data. Confirm encryption, retention, breach notification and cross-border obligations under the laws and contracts that apply (for example privacy law, PCI DSS or HIPAA where relevant).</li>`:""}<li>Vendor assurance: ${(S.dn||[]).length} document(s) reviewed. SOC 2 Type II reports and ISO 27001 certificates should be current and their scope should cover the services used.</li>${p.cnote?`<li>${h(p.cnote)}</li>`:""}</ul>`);
 const weak=R.filter(r=>r.pct!=null).sort((x,y)=>x.pct-y.pct).slice(0,3).map(r=>r.t);
 H.push(`<h2>15. Conclusion</h2><p>Overall inherent risk is ${top}. After the actions recorded to date, residual risk is ${topR}. Control coverage is ${cov}%${weak.length?`, with the weakest domains being ${weak.join(", ")}`:""}. Completing the CAPA register within the stated timeframes, starting with the ${hz[0][1]} items, will reduce the highest-impact risks first. ${h(p.concl)}</p>`);
 H.push(`<h2>Appendix A: Risk matrix</h2>`+heat()+`<h2>Appendix B: NIST / ISO mapping</h2>`+T(["Domain","NIST SP 800-53 (gap controls)","ISO/IEC 27001 Annex A (gap controls)","Existing controls","Gaps"],R.map(r=>{const l=a.filter(f=>f.Sec==r.t),u=k=>[...new Set(l.flatMap(f=>f[k].split(",").map(x=>x.trim())))].join(", ")||"-";return[r.t,u("N"),u("O"),`${r.g} in place, ${r.p} partial`,l.length]}))+`<h2>Appendix C: Risk heat map by domain and severity</h2>`+T(["Domain",...LV],R.map(r=>{const l=a.filter(f=>f.Sec==r.t);return[r.t,...LV.map(k=>{const n=l.filter(f=>f.Rt==k).length;return n?{t:n,bg:BC[k]}:0})]}))+`<h2>Appendix D: Glossary</h2>`+T(["Term","Definition"],[["STRA","Security Threat and Risk Assessment"],["CAPA","Corrective and preventive action"],["STRIDE","Spoofing, Tampering, Repudiation, Information disclosure, Denial of service, Elevation of privilege"],["Inherent risk","Risk before the effect of recorded actions"],["Residual risk","Risk remaining after recorded actions"],["MFA / SSO","Multi-factor authentication / single sign-on"],["SIEM / EDR / WAF","Security information and event management / endpoint detection and response / web application firewall"],["RBAC / PAM","Role-based access control / privileged access management"],["RTO / RPO","Recovery time objective / recovery point objective"],["SOC 2 Type II","Independent report on the operating effectiveness of a service provider's controls over a period"]])+`<h2>Appendix E: Open questions for the project team</h2><ul>${open.map(x=>`<li>${h(x)}</li>`).join("")||"<li>None</li>"}</ul><h2>Appendix F: Residual risk acceptance and sign-off</h2>`+T(["Role","Name","Signature","Date"],[["Risk owner","","",""],["Security lead","","",""],["Executive sponsor","","",""]])+`<p><i>Draft generated from analyst answers using rule-based scoring; analyst review is required before issue.</i></p>`);
 return H.join("\n")}
